[pytest]
asyncio_mode = auto
# Without this, pytest-asyncio's own deprecation warning was accurate: async
# fixtures default to a *function*-scoped event loop, torn down and recreated
# for every single test. app/db/session.py's SQLAlchemy async engine (and its
# connection pool) is a process-wide singleton, created once on whichever
# event loop is active the first time client/db_session is used, then reused
# by every later test's fixtures -- each running on a *different*, already-
# closed event loop. Using an async DB connection across event loops is
# undefined behavior for psycopg's async driver, and running the suite full
# vs. in isolation changes how many different event loops the shared engine
# gets handed across, which is why test_retrieval.py could pass every time in
# isolation while failing intermittently as part of the full suite. Pinning
# every async fixture (client, db_session, _database) to one session-wide
# event loop matches the engine's actual (process-lifetime) scope and removes
# the mismatch entirely.
asyncio_default_fixture_loop_scope = session
